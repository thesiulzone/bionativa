<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado de tu Pago | BioNativa LAB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-[#F8F6F0] text-[#1E3B2B] min-h-screen flex flex-col font-['Plus_Jakarta_Sans',sans-serif]">

  <!-- Header mínimo -->
  <header class="py-4 border-b border-stone-200 bg-white/80 backdrop-blur-md">
    <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
      <a href="/" class="flex items-center gap-2">
        <span class="font-['Cinzel',serif] text-xl font-bold tracking-widest text-[#1E3B2B]">BIONATIVA</span>
        <span class="text-[10px] bg-[#1E3B2B] text-white px-2 py-0.5 rounded tracking-wider uppercase">LAB</span>
      </a>
      <span class="text-xs text-stone-500 font-medium">Pasarela Segura SSL</span>
    </div>
  </header>

  <!-- Contenido de Respuesta -->
  <main class="flex-1 flex items-center justify-center p-4">
    <div id="status-card" class="bg-white max-w-lg w-full p-8 rounded-2xl shadow-lg border border-stone-200 text-center space-y-6">
      <!-- Se llena dinámicamente según la URL -->
      <div class="animate-pulse py-12">
        <div class="w-12 h-12 bg-stone-200 rounded-full mx-auto mb-4"></div>
        <div class="h-4 bg-stone-200 rounded w-48 mx-auto mb-2"></div>
        <div class="h-3 bg-stone-100 rounded w-64 mx-auto"></div>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const paymentId = params.get('payment_id') || params.get('collection_id') || '';
    const cardEl = document.getElementById('status-card');
    const showStatus = (kind, title, message, verified = false) => {
      const styles = kind === 'approved'
        ? ['bg-emerald-100 text-emerald-700', 'text-[#B67A52]', 'Transacción confirmada']
        : kind === 'pending'
          ? ['bg-amber-100 text-amber-700', 'text-amber-600', 'Pago pendiente']
          : ['bg-stone-100 text-stone-600', 'text-stone-500', 'Estado no confirmado'];
      const icon = kind === 'approved'
        ? '<svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>'
        : `<span class="text-2xl">${kind === 'pending' ? '…' : '!'}</span>`;
      cardEl.innerHTML = `
        <div class="w-16 h-16 rounded-full ${styles[0]} flex items-center justify-center mx-auto">
          ${icon}
        </div>
        <div class="space-y-2">
          <span class="text-xs font-bold ${styles[1]} uppercase tracking-wider">${styles[2]}</span>
          <h1 class="text-2xl font-bold text-[#1E3B2B]">${title}</h1>
          <p class="text-sm text-stone-600">${message}</p>
        </div>
        ${verified ? '<div class="bg-stone-50 p-3 rounded-lg text-xs font-mono text-stone-600">ID de Transacción: <strong id="verified-payment-id"></strong></div>' : ''}
        <div class="pt-4 flex flex-col sm:flex-row gap-3 justify-center">
          <a href="/" class="inline-flex justify-center items-center px-6 py-3 rounded-xl bg-[#1E3B2B] hover:bg-[#284f3a] text-white text-xs font-bold tracking-wide transition">Volver a la Tienda</a>
          ${verified ? '<a id="payment-whatsapp" href="https://wa.me/51981278458" class="inline-flex justify-center items-center px-6 py-3 rounded-xl border border-stone-300 hover:bg-stone-50 text-stone-700 text-xs font-bold tracking-wide transition">Notificar por WhatsApp</a>' : ''}
        </div>
      `;
      if (verified) {
        document.getElementById('verified-payment-id').textContent = paymentId;
        document.getElementById('payment-whatsapp').href = `https://wa.me/51981278458?text=${encodeURIComponent(`Hola BioNativa LAB, acabo de realizar mi pago. ID de Pago: ${paymentId}`)}`;
      }
    };

    async function verifyPayment() {
      if (!/^\d{1,30}$/.test(paymentId)) {
        showStatus('unknown', 'Aún no podemos confirmar tu pago', 'No encontramos un identificador de pago válido. Conserva tu carrito y vuelve a la tienda para consultar o reintentar.');
        return;
      }

      try {
        const response = await fetch(`/api/payment-status?payment_id=${encodeURIComponent(paymentId)}`, { headers: { Accept: 'application/json' } });
        if (!response.ok) throw new Error('No se pudo consultar el estado.');
        const data = await response.json();
        if (data.status === 'approved') {
          try {
            localStorage.removeItem('bionativa_cart_v1');
            localStorage.removeItem('bionativa_cart');
          } catch (error) {}
          showStatus('approved', '¡Gracias por tu compra!', 'Mercado Pago confirmó tu pago. BioNativa LAB ya puede preparar tu pedido.', true);
        } else if (data.status === 'pending' || data.status === 'in_process') {
          showStatus('pending', 'Estamos validando tu pago', 'Mercado Pago aún muestra la transacción pendiente. El carrito se conserva mientras se confirma.');
        } else {
          showStatus('unknown', 'Tu pago no figura como aprobado', 'Mercado Pago no confirma un pago aprobado para esta operación. El carrito se conserva; puedes volver a la tienda para revisar el pedido.');
        }
      } catch (error) {
        showStatus('unknown', 'No pudimos consultar el pago', 'La verificación con Mercado Pago no respondió. No hemos marcado la compra como pagada y conservamos tu carrito. Inténtalo nuevamente más tarde.');
      }
    }

    verifyPayment();
  </script>
</body>
</html>
