<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Outfit:wght@400;500;600&amp;display=swap');
      .brand-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 32px; fill: #1E3B2B; letter-spacing: -0.5px; }
      .brand-sub { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #B67A52; letter-spacing: 2px; }
      .brand-slogan { font-family: 'Outfit', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 11.5px; fill: #2C3531; letter-spacing: 0.3px; }
    </style>
  </defs>

  <!-- Logo Mark (Leaf & Mineral Drop) -->
  <g transform="translate(10, 5) scale(0.65)">
    <!-- Left Leaf (Botanical Organic - Deep Green #1E3B2B) -->
    <path d="M 60 10 C 60 10 20 50 20 80 C 20 102 38 120 60 120 Z" 
          fill="none" stroke="#1E3B2B" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Center Line -->
    <line x1="60" y1="12" x2="60" y2="118" stroke="#1E3B2B" stroke-width="6" stroke-linecap="round" />
    
    <!-- Left Veins -->
    <path d="M 60 45 C 45 52 35 62 30 75" fill="none" stroke="#1E3B2B" stroke-width="5" stroke-linecap="round" />
    <path d="M 60 70 C 48 78 40 88 35 100" fill="none" stroke="#1E3B2B" stroke-width="5" stroke-linecap="round" />
    <path d="M 60 92 C 52 97 46 104 42 112" fill="none" stroke="#1E3B2B" stroke-width="4.5" stroke-linecap="round" />

    <!-- Right Leaf (Geometric & Mineral - Warm Terracotta #B67A52) -->
    <path d="M 60 10 C 60 10 100 50 100 80 C 100 102 82 120 60 120 Z" 
          fill="none" stroke="#B67A52" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Right Geometric / Crystal Facets -->
    <polyline points="60,35 85,55 60,75" fill="none" stroke="#B67A52" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
    <polyline points="85,55 95,80 60,95" fill="none" stroke="#B67A52" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
    <line x1="85" y1="55" x2="60" y2="55" stroke="#B67A52" stroke-width="4.5" stroke-linecap="round" />
    <line x1="60" y1="75" x2="92" y2="92" stroke="#B67A52" stroke-width="4.5" stroke-linecap="round" />
    <line x1="60" y1="95" x2="80" y2="113" stroke="#B67A52" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(100, 36)">
    <text x="0" y="0" class="brand-title">BioNativa</text>
    <text x="160" y="-1" class="brand-sub">LAB</text>
    <text x="2" y="22" class="brand-slogan">El estándar de tu naturaleza</text>
  </g>
</svg>
